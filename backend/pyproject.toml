[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-compare-backend"
version = "0.1.0"
description = "Backend API and climate data processing for Weather Compare"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.137.2",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.15.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
